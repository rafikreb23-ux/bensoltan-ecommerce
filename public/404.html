<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جاري التوجيه...</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8fafc; direction: rtl; }
    .container { text-align: center; padding: 2rem; max-width: 400px; }
    .spinner { width: 48px; height: 48px; border: 4px solid #e2e8f0; border-top-color: #1e40af; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1.5rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { color: #1e293b; margin-bottom: 0.5rem; font-size: 1.5rem; }
    p { color: #64748b; margin-bottom: 1.5rem; }
    a { display: inline-block; padding: 0.75rem 1.5rem; background: #1e40af; color: white; border-radius: 8px; font-weight: 600; text-decoration: none; transition: background 0.2s; }
    a:hover { background: #1e3a8a; }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner" aria-hidden="true"></div>
    <h1>جاري التوجيه...</h1>
    <p>يرجى الانتظار</p>
    <a href="/" id="fallback">العودة للرئيسية</a>
  </div>
  <script>
    const cleanPaths = {
      '/about': '/about.html',
      '/services': '/services.html',
      '/contact': '/contact.html',
      '/about/': '/about.html',
      '/services/': '/services.html',
      '/contact/': '/contact.html'
    };
    const path = window.location.pathname;
    const target = cleanPaths[path] || cleanPaths[path.replace(/\/$/, '')];
    if (target) {
      window.location.replace(target);
    } else {
      document.getElementById('fallback').style.display = 'inline-block';
      document.querySelector('.spinner').style.display = 'none';
      document.querySelector('h1').textContent = 'الصفحة غير موجودة';
      document.querySelector('p').textContent = 'المسار غير معروف: ' + path;
    }
  </script>
</body>
</html>
