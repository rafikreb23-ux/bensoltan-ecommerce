<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview icons</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<section class="contact-section">
  <div class="container">
    <div class="contact-grid">
      <div class="contact-info">
        <div class="contact-methods">
              <article class="contact-method">
                <div class="method-icon" aria-hidden="true">
                  <img src="/images/icons/email-address-gradient-transparent.png" alt="" loading="lazy">
                </div>
                <div class="method-content">
                  <h3>البريد الإلكتروني</h3>
                  <a href="mailto:contact@bensoltandecommerce.tn">contact@bensoltandecommerce.tn</a>
                  <span class="method-note">للاستفسارات العامة والعروض</span>
                </div>
              </article>

              <article class="contact-method">
                <div class="method-icon" aria-hidden="true">
                  <img src="/images/icons/phone-call-gradient-transparent.png" alt="" loading="lazy">
                </div>
                <div class="method-content">
                  <h3>الهاتف</h3>
                  <a href="tel:+21622951910" dir="ltr">+216 22 951 910</a>
                  <span class="method-note">الإثنين - السبت: 9:00 - 18:00</span>
                </div>
              </article>

              <article class="contact-method">
                <div class="method-icon" aria-hidden="true">
                  <img src="/images/icons/location-blue-v3.png" alt="" loading="lazy">
                </div>
                <div class="method-content">
                  <h3>الموقع على الخريطة</h3>
                  <span class="method-note">القصرين، تونس - حي النور</span>
                </div>
              </article>
        </div>

        <div class="social-contact">
          <h3>تابعنا</h3>
          <div class="social-links" role="list" aria-label="روابط التواصل الاجتماعي">
            <a href="#" class="social-link social-link--circle" aria-label="فيسبوك" role="listitem">
              <img src="/images/icons/facebook-gradient-circle.png" alt="" loading="lazy">
            </a>
            <a href="#" class="social-link social-link--circle" aria-label="لينكد إن" role="listitem">
              <img src="/images/icons/linkedin-gradient-circle.png" alt="" loading="lazy">
            </a>
            <a href="#" class="social-link social-link--circle" aria-label="واتساب" role="listitem">
              <img src="/images/icons/whatsapp-gradient-circle.png" alt="" loading="lazy">
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
</body>
</html>
