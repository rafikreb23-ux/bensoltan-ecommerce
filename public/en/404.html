<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8fafc; direction: ltr; }
    .container { text-align: center; padding: 2rem; max-width: 400px; }
    .spinner { width: 48px; height: 48px; border: 4px solid #e2e8f0; border-top-color: #1e40af; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1.5rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { color: #1e293b; margin-bottom: 0.5rem; font-size: 1.5rem; }
    p { color: #64748b; margin-bottom: 1.5rem; }
    a { display: none; padding: 0.75rem 1.5rem; background: #1e40af; color: white; border-radius: 8px; font-weight: 600; text-decoration: none; transition: background 0.2s; }
    a:hover { background: #1e3a8a; }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner" aria-hidden="true"></div>
    <h1>Redirecting...</h1>
    <p>Please wait</p>
    <a href="/en/" id="fallback">Back to Home</a>
  </div>
  <script>
    const cleanPaths = {
      '/en/about': '/en/about.html',
      '/en/services': '/en/services.html',
      '/en/contact': '/en/contact.html',
      '/en/about/': '/en/about.html',
      '/en/services/': '/en/services.html',
      '/en/contact/': '/en/contact.html'
    };
    const path = window.location.pathname;
    const target = cleanPaths[path] || cleanPaths[path.replace(/\/$/, '')];
    if (target) {
      window.location.replace(target);
    } else {
      document.getElementById('fallback').style.display = 'inline-block';
      document.querySelector('.spinner').style.display = 'none';
      document.querySelector('h1').textContent = 'Page not found';
      document.querySelector('p').textContent = 'Unknown path: ' + path;
    }
  </script>
</body>
</html>
